name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env: { POSTGRES_USER: jigmap, POSTGRES_PASSWORD: jigmap, POSTGRES_DB: jigmap }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jigmap" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Start S3-compatible storage (SeaweedFS)
        run: |
          docker run -d --name s3 -p 9000:8333 \
            -v "$GITHUB_WORKSPACE/deploy/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro" \
            chrislusf/seaweedfs:3.97 server -dir=/data -s3 -s3.port=8333 \
            -s3.config=/etc/seaweedfs/s3.json -master.volumeSizeLimitMB=128 -master.volumePreallocate=false
          for i in $(seq 1 60); do curl -sf http://localhost:9000/healthz && break || sleep 2; done
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests && ruff format --check app tests
      - run: python -m pytest -q

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "3.47.9", channel: stable }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release --dart-define=API_BASE_URL=http://localhost:8000
