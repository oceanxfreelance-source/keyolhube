name: jigmap

x-api-env: &api-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-jigmap}:${POSTGRES_PASSWORD:-jigmap}@db:5432/${POSTGRES_DB:-jigmap}
  REDIS_URL: redis://redis:6379/0

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jigmap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jigmap}
      POSTGRES_DB: ${POSTGRES_DB:-jigmap}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    image: jigmap/api:dev
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment: *api-env
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/health/ready').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    image: jigmap/api:dev
    env_file:
      - path: .env
        required: false
    environment: *api-env
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    depends_on:
      api: { condition: service_healthy }   # api runs migrations first

volumes:
  db_data:
  redis_data:
